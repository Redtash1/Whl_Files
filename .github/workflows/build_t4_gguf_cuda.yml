name: Build Linux llamacpp GGUF CUDA Wheel

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python version (3.11 or higher)"
        required: true
        default: "3.12"
        type: choice
        options: ["3.11", "3.12", "3.13", "3.14"]
      torch_version:
        description: "PyTorch version"
        required: true
        default: "2.6.0"
        type: string
      cuda_version:
        description: "CUDA family"
        required: true
        default: "12.6"
        type: choice
        options: ["12.6", "12.8", "13.0"]
      gpu_arch_list:
        description: "CUDA architectures, e.g. 7.5;8.0;8.6;8.9"
        required: true
        default: "7.5;8.0;8.6;8.9"
        type: string
      upstream_ref:
        description: "deepbeepmeep/kernels branch, tag, or commit"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:${{ inputs.cuda_version }}.3-devel-ubuntu22.04
    env:
      PYTHON_VERSION: ${{ inputs.python_version }}
      TORCH_VERSION: ${{ inputs.torch_version }}
      CUDA_VERSION: ${{ inputs.cuda_version }}
      TORCH_CUDA_ARCH_LIST: ${{ inputs.gpu_arch_list }}
      UPSTREAM_REF: ${{ inputs.upstream_ref }}
      MAX_JOBS: "2"

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euxo pipefail
          case "$PYTHON_VERSION" in 3.11|3.12|3.13|3.14) ;; *) exit 1 ;; esac
          case "$CUDA_VERSION" in
            12.6) echo "TORCH_INDEX=https://download.pytorch.org/whl/cu126" >> "$GITHUB_ENV" ;;
            12.8) echo "TORCH_INDEX=https://download.pytorch.org/whl/cu128" >> "$GITHUB_ENV" ;;
            13.0) echo "TORCH_INDEX=https://download.pytorch.org/whl/cu130" >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac
          echo "CUDA_COMPACT=$(echo "$CUDA_VERSION" | tr -d '.')" >> "$GITHUB_ENV"
          echo "TORCH_COMPACT=$(echo "$TORCH_VERSION" | tr -d '.')" >> "$GITHUB_ENV"
          echo "PY_COMPACT=$(echo "$PYTHON_VERSION" | tr -d '.')" >> "$GITHUB_ENV"

      - name: Install base tools
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            curl ca-certificates git build-essential cmake ninja-build \
            libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev \
            libffi-dev liblzma-dev xz-utils tk-dev patchelf
          rm -rf /var/lib/apt/lists/*

      - name: Install UV and Python
        shell: bash
        run: |
          set -euxo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv python install "$PYTHON_VERSION"
          uv venv --python "$PYTHON_VERSION" /opt/llamacpp-build

      - name: Install Torch and build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --python /opt/llamacpp-build/bin/python \
            --index-url "$TORCH_INDEX" "torch==$TORCH_VERSION"
          uv pip install --python /opt/llamacpp-build/bin/python \
            pip setuptools wheel packaging ninja cmake numpy

      - name: Clone source
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/deepbeepmeep/kernels.git /work/kernels
          cd /work/kernels
          git checkout "$UPSTREAM_REF"
          test -d /work/kernels/llama.cpp
          mkdir -p /work/artifact
          git rev-parse HEAD | tee /work/artifact/upstream_commit.txt

      - name: Relax Python metadata upper bound only when necessary
        shell: bash
        run: |
          set -euxo pipefail
          cd /work/kernels/llama.cpp
          /opt/llamacpp-build/bin/python - <<'PY'
          from pathlib import Path
          import json, re, sys
          py = sys.version_info
          target = f"{py.major}.{py.minor}"
          records = []
          for path in (Path("pyproject.toml"), Path("setup.cfg"), Path("setup.py")):
              if not path.exists():
                  continue
              original = path.read_text(encoding="utf-8")
              patched = original
              for bound in (12, 13, 14, 15):
                  pat = rf"<3\.{bound}"
                  if re.search(pat, patched) and py.minor >= bound:
                      new = f"<3.{py.minor + 1}"
                      patched = re.sub(pat, new, patched)
                      records.append({"file": str(path), "old": f"<3.{bound}", "new": new})
                      break
              if patched != original:
                  Path(str(path)+".before_python_metadata_patch").write_text(original, encoding="utf-8")
                  path.write_text(patched, encoding="utf-8")
          Path("/work/artifact/python_metadata_patch.json").write_text(
              json.dumps({"target_python": target, "changes": records}, indent=2), encoding="utf-8")
          print(records)
          PY
          git diff -- . | tee /work/artifact/python_metadata_patch.diff

      - name: Inject Torch CUDA Python info into package local version
        shell: bash
        run: |
          set -euxo pipefail
          cd /work/kernels/llama.cpp
          /opt/llamacpp-build/bin/python - <<'PY'
          from pathlib import Path
          import re, os, json
          local = f"torch{os.environ['TORCH_COMPACT']}cu{os.environ['CUDA_COMPACT']}.py{os.environ['PY_COMPACT']}"
          changed = False
          details = []
          p = Path("pyproject.toml")
          if p.exists():
              s = p.read_text(encoding="utf-8")
              m = re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', s)
              if m:
                  old = m.group(1); base = old.split("+",1)[0]; new = f"{base}+{local}"
                  p.write_text(s[:m.start(1)] + new + s[m.end(1):], encoding="utf-8")
                  details.append({"file":"pyproject.toml","old":old,"new":new}); changed=True
          if not changed:
              p = Path("setup.py")
              if p.exists():
                  s = p.read_text(encoding="utf-8")
                  m = re.search(r'version\s*=\s*["\']([^"\']+)["\']', s)
                  if m:
                      old=m.group(1); base=old.split("+",1)[0]; new=f"{base}+{local}"
                      p.write_text(s[:m.start(1)] + new + s[m.end(1):], encoding="utf-8")
                      details.append({"file":"setup.py","old":old,"new":new}); changed=True
          Path("/work/artifact/version_tag_patch.json").write_text(
              json.dumps({"local_version":local,"changed":changed,"details":details}, indent=2), encoding="utf-8")
          print(details)
          PY
          git diff -- . | tee /work/artifact/all_metadata_diffs.diff

      - name: Validate environment
        shell: bash
        run: |
          set -euxo pipefail
          /opt/llamacpp-build/bin/python - <<'PY' | tee /work/artifact/python_torch_environment.txt
          import sys, torch, numpy
          print("Python:", sys.version)
          print("Torch:", torch.__version__)
          print("Torch CUDA:", torch.version.cuda)
          print("NumPy:", numpy.__version__)
          PY
          nvcc --version | tee /work/artifact/nvcc_version.txt

      - name: Build wheel
        id: wheel_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p /work/dist
          cd /work/kernels/llama.cpp
          /opt/llamacpp-build/bin/python -m pip wheel . \
            --no-build-isolation --no-deps -w /work/dist \
            2>&1 | tee /work/artifact/build.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /work/artifact/build_exit_code.txt
          [ "$rc" -eq 0 ] && ls -lh /work/dist | tee /work/artifact/dist_listing.txt
          exit "$rc"

      - name: Inspect successful wheel
        if: steps.wheel_build.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          WHEEL="$(find /work/dist -maxdepth 1 -name 'llamacpp_gguf_cuda*.whl' | head -n 1)"
          test -n "$WHEEL"
          cp "$WHEEL" /work/artifact/
          basename "$WHEEL" | tee /work/artifact/wheel_filename.txt
          /opt/llamacpp-build/bin/python -m zipfile -l "$WHEEL" > /work/artifact/wheel_contents.txt
          sha256sum /work/artifact/*.whl | tee /work/artifact/SHA256SUMS.txt

      - name: Install and import successful wheel
        if: steps.wheel_build.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          WHEEL="$(find /work/dist -maxdepth 1 -name 'llamacpp_gguf_cuda*.whl' | head -n 1)"
          uv pip install --python /opt/llamacpp-build/bin/python --no-deps --reinstall "$WHEEL"
          /opt/llamacpp-build/bin/python - <<'PY' 2>&1 | tee /work/artifact/import_test.log
          import sys, llamacpp_gguf_cuda
          print("Python:", sys.version)
          print("Module:", llamacpp_gguf_cuda.__file__)
          print("CPU-side import PASS")
          PY

      - name: Create manifest
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          cat > /work/artifact/BUILD_TARGET.txt <<TXT
          Package: llamacpp_gguf_cuda
          OS: Linux x86_64
          Python: $PYTHON_VERSION
          Torch: $TORCH_VERSION
          CUDA: $CUDA_VERSION
          CUDA architectures: $TORCH_CUDA_ARCH_LIST
          Upstream ref: $UPSTREAM_REF
          TXT

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: llamacpp-gguf-cuda-linux-py${{ inputs.python_version }}-torch${{ inputs.torch_version }}-cu${{ inputs.cuda_version }}
          path: /work/artifact/*
          if-no-files-found: error
          compression-level: 0

      - name: Fail after diagnostics if build failed
        if: steps.wheel_build.outcome != 'success'
        shell: bash
        run: |
          echo "Native wheel build failed; diagnostic artifact was uploaded."
          exit 1
